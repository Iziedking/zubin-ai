# Crypto Agent Example with Polymarket
agents:
  executor:
    llm:
      model: openai/gpt-4o
      temperature: 0.3
      max_tokens: 8000
    prediction_strategy: react
    toolkits:
      # Polymarket (prediction markets)
      - class_name: PolymarketToolkit
        enabled: true
        toolkit_config:
          timeout: 30
          cache_ttl: 300
      
      # Binance (spot/futures trading)
      - class_name: BinanceToolkit
        enabled: true
        include_tools:
          - get_current_price
          - get_ticker_stats
          - get_klines
        toolkit_config:
          enable_analysis: true
          default_market: spot
      
      # DefiLlama (DeFi protocols)
      - class_name: DefiLlamaToolkit
        enabled: true
        include_tools:
          - get_protocols
          - get_protocol_tvl
        toolkit_config:
          enable_analysis: true
      
      # Calculator
      - class_name: CalculatorToolkit
        enabled: true

runtime:
  max_depth: 3
  timeout: 300
  enable_logging: true
